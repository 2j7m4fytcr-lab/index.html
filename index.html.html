        // ==========================================
        // V6. STUDY-FIRST COMMAND HUB
        // ==========================================
        function StudyFirstHub({ studySessions, setStudySessions, studyHub, setStudyHub, addXPAndCrystals, addNotification, addLog, triggerSound }) {
            const subjects = ['ریاضی','فیزیک','شیمی','زیست‌شناسی','عمومی','سایر'];
            const [subject,setSubject] = useState('ریاضی');
            const [topic,setTopic] = useState('');
            const [minutes,setMinutes] = useState(25);
            const [secondsLeft,setSecondsLeft] = useState(25*60);
            const [running,setRunning] = useState(false);
            const [taskText,setTaskText] = useState('');
            const [showReview,setShowReview] = useState(false);

            const tasks = Array.isArray(studyHub.tasks) ? studyHub.tasks : createInitialStudyTasks();
            const setTasks = (updater) => {
                setStudyHub(prev => {
                    const currentTasks = Array.isArray(prev.tasks) ? prev.tasks : createInitialStudyTasks();
                    const nextTasks = typeof updater === 'function' ? updater(currentTasks) : updater;
                    return { ...prev, tasks: nextTasks };
                });
            };

            useEffect(()=>{ 
                if(!running) return; 
                const id=setInterval(()=>setSecondsLeft(v=>{
                    if(v<=1){
                        clearInterval(id);
                        setRunning(false);
                        triggerSound('complete');
                        addNotification('[جلسه تمرکز تمام شد]','اگر واقعاً مطالعه کردی، جلسه را ثبت کن. اگر نه، می‌توانی استراحت کنی یا ادامه بدهی.','success');
                        return 0;
                    }
                    return v-1;
                }),1000);
                return ()=>clearInterval(id);
            },[running]);

            const today=new Date();
            const dayStart=new Date(today.getFullYear(),today.getMonth(),today.getDate()).getTime();
            const todaySessions=studySessions.filter(x=>new Date(x.date).getTime()>=dayStart);
            const todayMinutes=todaySessions.reduce((a,x)=>a+(Number(x.minutes)||0),0);
            const weekStart=Date.now()-7*24*60*60*1000;
            const weekSessions=studySessions.filter(x=>new Date(x.date).getTime()>=weekStart);
            const weekMinutes=weekSessions.reduce((a,x)=>a+(Number(x.minutes)||0),0);
            const done=tasks.filter(t=>t.done).length;
            const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
            const start=()=>{if(secondsLeft===0)setSecondsLeft(minutes*60);setRunning(true);triggerSound('click');};
            const reset=()=>{setRunning(false);setSecondsLeft(minutes*60);};
            const saveSession=()=>{
                const actual=Math.max(1,Math.min(240,Number(minutes)||25));
                const record={id:Date.now(),subject,topic:topic.trim()||'مطالعه آزاد',minutes:actual,date:new Date().toISOString(),kind:'focus'};
                setStudySessions(prev=>[record,...prev]);
                const xp=Math.min(100,Math.max(8,Math.round(actual*0.8)));
                addXPAndCrystals(xp,Math.max(2,Math.round(actual/10)));
                addLog(`جلسه مطالعه ثبت شد: ${subject}، ${record.topic}، ${actual} دقیقه`,'success');
                addNotification('[مطالعه ثبت شد]',`${actual} دقیقه ${subject} ثبت شد. پاداش فقط برای زمانی است که واقعاً مطالعه کردی.`,'success');
                setTopic('');setRunning(false);setSecondsLeft(minutes*60);
            };
            const addTask=()=>{const v=taskText.trim();if(!v)return;setTasks(t=>[...t,{id:Date.now(),text:v,subject,done:false}]);setTaskText('');};
            const toggleTask=id=>setTasks(t=>t.map(x=>x.id===id?{...x,done:!x.done}:x));
            const resetTasks=()=>setTasks(t=>t.map(x=>({...x,done:false})));
            const pct=minutes>0?Math.round((1-secondsLeft/(minutes*60))*100):0;

            return <div class="space-y-5 animate-arise">
                <section class="system-panel rounded-2xl p-5 md:p-7 border border-cyan-300/50" style={{background:'radial-gradient(ellipse at 85% 0%,rgba(0,190,255,.18),transparent 48%),linear-gradient(135deg,rgba(8,29,58,.98),rgba(4,10,25,.98))'}}>
                    <div class="flex flex-wrap items-center justify-between gap-2"><span class="text-[10px] tracking-[.25em] text-cyan-300 font-black">SYSTEM V6 // REAL PROGRESS PROTOCOL</span><span class="text-[10px] rounded-full border border-emerald-400/40 bg-emerald-950/40 px-3 py-1 text-emerald-300">STUDY FIRST</span></div>
                    <h2 class="text-2xl md:text-3xl font-black text-white mt-3">مرکز فرماندهی مطالعه</h2>
                    <p class="text-sm text-slate-300 mt-2 max-w-2xl">مأموریت امروزت را انتخاب کن، یک جلسه واقعی مطالعه انجام بده و پیشرفتت را ثبت کن. بازی فقط بازتاب تلاش واقعی توست.</p>
                    <div class="grid grid-cols-3 gap-2 mt-5">
                        <div class="rounded-xl bg-black/35 p-3 text-center"><div class="text-[10px] text-slate-400">مطالعه امروز</div><div class="text-xl md:text-2xl font-black text-cyan-300">{todayMinutes}<small class="text-xs mr-1">دقیقه</small></div></div>
                        <div class="rounded-xl bg-black/35 p-3 text-center"><div class="text-[10px] text-slate-400">جلسات امروز</div><div class="text-xl md:text-2xl font-black text-purple-300">{todaySessions.length}</div></div>
                        <div class="rounded-xl bg-black/35 p-3 text-center"><div class="text-[10px] text-slate-400">مطالعه ۷ روز</div><div class="text-xl md:text-2xl font-black text-amber-300">{weekMinutes}<small class="text-xs mr-1">دقیقه</small></div></div>
                    </div>
                </section>
                <section class="grid grid-cols-1 lg:grid-cols-[1.15fr_.85fr] gap-4">
                    <div class="system-panel rounded-2xl p-5 md:p-6">
                        <div class="flex items-center justify-between"><div><div class="text-[10px] tracking-widest text-cyan-300 font-black">TRAINING ROOM</div><h3 class="text-xl font-black text-white mt-1">اتاق تمرین</h3></div><i data-lucide="timer" class="w-7 h-7 text-cyan-300"></i></div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
                            <label class="text-xs text-slate-300">درس<select value={subject} onChange={e=>setSubject(e.target.value)} disabled={running} class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-3">{subjects.map(x=><option key={x}>{x}</option>)}</select></label>
                            <label class="text-xs text-slate-300">مدت جلسه (دقیقه)<input type="number" min="1" max="240" value={minutes} disabled={running} onChange={e=>{const v=Math.max(1,Math.min(240,Number(e.target.value)||1));setMinutes(v);setSecondsLeft(v*60);}} class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-3"/></label>
                        </div>
                        <label class="block text-xs text-slate-300 mt-3">مبحث یا هدف جلسه<input value={topic} onChange={e=>setTopic(e.target.value)} placeholder="مثلاً: حل تمرین تابع" class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-3"/></label>
                        <div class="text-center py-5"><div class="text-5xl md:text-6xl font-black tracking-wider text-cyan-200" style={{textShadow:'0 0 22px rgba(34,211,238,.45)'}}>{fmt(secondsLeft)}</div><div class="text-[10px] text-slate-500 mt-2">{running?'FOCUS SESSION IN PROGRESS':secondsLeft===0?'SESSION TIMER COMPLETE':'READY TO BEGIN'}</div><div class="h-1.5 bg-slate-800 rounded-full mt-4 overflow-hidden"><div class="h-full bg-cyan-400 transition-all" style={{width:`${pct}%`}}></div></div></div>
                        <div class="flex gap-2"><button onClick={start} disabled={running} class="flex-1 rounded-xl py-3 bg-cyan-400 text-slate-950 font-black disabled:opacity-40">{secondsLeft===0?'شروع دوباره':'شروع تمرکز'}</button><button onClick={()=>setRunning(false)} disabled={!running} class="px-4 rounded-xl border border-amber-400/40 text-amber-200 disabled:opacity-30">مکث</button><button onClick={reset} class="px-4 rounded-xl border border-slate-600 text-slate-300">بازنشانی</button></div>
                        {secondsLeft===0&&!running&&<button onClick={saveSession} class="w-full mt-3 rounded-xl py-3 bg-emerald-500 text-slate-950 font-black">مطالعه واقعی انجام شد؛ ثبت جلسه و دریافت XP</button>}
                        {secondsLeft>0&&!running&&<button onClick={saveSession} class="w-full mt-3 rounded-xl py-2.5 border border-emerald-500/40 text-emerald-300 text-xs">ثبت دستی جلسه (اگر مطالعه را انجام داده‌ام)</button>}
                        <p class="text-[10px] text-slate-500 mt-3">تایمر ابزار تمرکز است، نه اثبات مطالعه. فقط زمان واقعی مطالعه را ثبت کن؛ می‌توانی هر زمان مکث کنی.</p>
                    </div>
                    <div class="system-panel rounded-2xl p-5">
                        <div class="flex items-center justify-between"><div><div class="text-[10px] tracking-widest text-amber-300 font-black">DAILY QUESTS</div><h3 class="text-xl font-black text-white mt-1">مأموریت‌های امروز</h3></div><span class="text-sm font-black text-cyan-300">{done}/{tasks.length}</span></div>
                        <div class="h-2 bg-slate-800 rounded-full mt-4 overflow-hidden"><div class="h-full bg-gradient-to-r from-cyan-500 to-emerald-400" style={{width:`${tasks.length?done/tasks.length*100:0}%`}}></div></div>
                        <div class="space-y-2 mt-4">{tasks.map(t=><label key={t.id} class="flex items-start gap-3 p-3 rounded-xl bg-slate-950/70 border border-slate-800 cursor-pointer"><input type="checkbox" checked={!!t.done} onChange={()=>toggleTask(t.id)} class="mt-1 accent-cyan-400"/><span class={`text-xs leading-6 ${t.done?'line-through text-slate-600':'text-slate-200'}`}>{t.text}<small class="block text-[10px] text-slate-500">{t.subject||'شخصی'}</small></span></label>)}</div>
                        <div class="flex gap-2 mt-3"><input value={taskText} onChange={e=>setTaskText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTask()} placeholder="مأموریت جدید..." class="min-w-0 flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs"/><button onClick={addTask} class="px-4 rounded-lg bg-cyan-900 text-cyan-200 border border-cyan-500/40">افزودن</button></div>
                        <button onClick={resetTasks} class="text-[10px] text-slate-500 mt-3 hover:text-slate-300">بازنشانی تیک‌های مأموریت</button>
                    </div>
                </section>
                <section class="system-panel rounded-2xl p-5">
                    <div class="flex flex-wrap items-center justify-between gap-2"><div><div class="text-[10px] tracking-widest text-purple-300 font-black">WEEKLY EVALUATION</div><h3 class="text-xl font-black text-white mt-1">گزارش پیشرفت واقعی</h3></div><button onClick={()=>setShowReview(v=>!v)} class="text-xs border border-purple-400/40 text-purple-200 rounded-lg px-3 py-2">{showReview?'بستن گزارش':'نمایش گزارش هفتگی'}</button></div>
                    {showReview&&<div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-4"><div class="rounded-xl bg-slate-950 p-3"><div class="text-[10px] text-slate-500">زمان مطالعه</div><div class="text-xl font-black text-cyan-300">{weekMinutes} دقیقه</div></div><div class="rounded-xl bg-slate-950 p-3"><div class="text-[10px] text-slate-500">تعداد جلسات</div><div class="text-xl font-black text-purple-300">{weekSessions.length}</div></div><div class="rounded-xl bg-slate-950 p-3"><div class="text-[10px] text-slate-500">میانگین جلسه</div><div class="text-xl font-black text-amber-300">{weekSessions.length?Math.round(weekMinutes/weekSessions.length):0} دقیقه</div></div><div class="rounded-xl bg-slate-950 p-3"><div class="text-[10px] text-slate-500">مأموریت‌های امروز</div><div class="text-xl font-black text-emerald-300">{done}/{tasks.length}</div></div></div>}
                    <div class="mt-4"><h4 class="text-sm font-bold text-slate-200">آخرین جلسات ثبت‌شده</h4>{studySessions.length?<div class="space-y-2 mt-2 max-h-64 overflow-y-auto">{studySessions.slice(0,8).map(x=><div key={x.id} class="flex items-center justify-between gap-3 rounded-lg bg-slate-950/70 p-3"><div><div class="text-xs text-white font-bold">{x.subject} • {x.topic||'مطالعه'}</div><div class="text-[10px] text-slate-500 mt-1">{new Date(x.date).toLocaleString('fa-IR')}</div></div><div class="text-sm font-black text-cyan-300">{x.minutes} دقیقه</div></div>)}</div>:<p class="text-xs text-slate-500 py-4">هنوز جلسه‌ای ثبت نشده؛ اولین جلسه‌ات را از اتاق تمرین شروع کن.</p>}</div>
                </section>
                <div class="text-center text-[10px] text-slate-600">قانون سیستم: یادگیری واقعی مهم‌تر از Level، XP و هر جایزه‌ای است. استراحت و انعطاف بخشی از برنامه‌اند.</div>
            </div>;
        }

        // ==========================================
        // V4. ADAPTIVE STUDY PLANNER
        // ==========================================
        function AdaptiveStudyPlanner({ data, setData, studySessions, addXPAndCrystals, addNotification, addLog }) {
            const [subjectInput, setSubjectInput] = useState('');
            const [weeklySubject, setWeeklySubject] = useState('ریاضی');
            const [weeklyDay, setWeeklyDay] = useState('شنبه');
            const [weeklyMinutes, setWeeklyMinutes] = useState(45);
            const [gradeSubject, setGradeSubject] = useState('ریاضی');
            const [gradeValue, setGradeValue] = useState('');
            const [gradeNote, setGradeNote] = useState('');

            const now = new Date();
            const todayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            const weekAgo = Date.now() - 7*24*60*60*1000;
            const recent = studySessions.filter(x => new Date(x.date).getTime() >= weekAgo);
            const recentMinutes = recent.reduce((a,x) => a + (Number(x.minutes)||0), 0);
            const average = recent.length ? Math.round(recentMinutes / recent.length) : 0;
            const level = recentMinutes < 120 ? 'starter' : recentMinutes < 360 ? 'steady' : 'advanced';
            const target = level === 'starter' ? 25 : level === 'steady' ? 35 : 45;
            const targetLabel = level === 'starter' ? 'شروع آرام' : level === 'steady' ? 'ریتم پایدار' : 'تمرکز عمیق';
            const missions = [
                { id:'focus', title:`یک نوبت تمرکز ${target} دقیقه‌ای`, desc:'یک مبحث مشخص انتخاب کن و فقط روی همان کار بمان.', mins:target, xp:35 },
                { id:'review', title:'مرور فعال ۱۵ دقیقه‌ای', desc:'بدون نگاه‌کردن به جزوه، نکات مهم را از حافظه بازیابی کن.', mins:15, xp:20 },
                { id:'practice', title:'تمرین یا تست هدفمند', desc:'چند سؤال متناسب با مبحث امروز حل کن و اشتباه‌ها را بررسی کن.', mins:20, xp:25 }
            ];
            const doneToday = missions.filter(m => data.completed[`${todayKey}_${m.id}`]).length;
            const finishMission = m => {
                const key = `${todayKey}_${m.id}`;
                if (data.completed[key]) return;
                setData(d => ({...d, completed:{...d.completed,[key]:true}}));
                addXPAndCrystals(m.xp, 10);
                addLog(`مأموریت هوشمند تکمیل شد: ${m.title}`);
                addNotification('[مأموریت تکمیل شد]', `+${m.xp} XP برای ${m.title}`, 'success');
            };
            const addSubject = () => {
                const value = subjectInput.trim();
                if (!value || data.subjects.includes(value)) return;
                setData(d => ({...d, subjects:[...d.subjects,value]})); setSubjectInput('');
            };
            const addWeekly = () => {
                if (!weeklySubject) return;
                setData(d => ({...d, weekly:[...d.weekly,{id:Date.now(),subject:weeklySubject,day:weeklyDay,minutes:Number(weeklyMinutes)}]}));
            };
            const addGrade = () => {
                const n = Number(gradeValue);
                if (!gradeSubject || gradeValue === '' || !Number.isFinite(n) || n < 0 || n > 20) return;
                setData(d => ({...d, grades:[{id:Date.now(),subject:gradeSubject,score:n,note:gradeNote.trim(),date:todayKey},...d.grades]}));
                setGradeValue(''); setGradeNote('');
            };
            const subjectMinutes = data.subjects.map(subject => ({subject, minutes:recent.filter(x=>x.subject===subject).reduce((a,x)=>a+(Number(x.minutes)||0),0)}));
            const weakest = [...subjectMinutes].sort((a,b)=>a.minutes-b.minutes)[0];
            const days = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
            return (
                <div class="space-y-5 animate-arise">
                    <section class="system-panel monarch-panel rounded-2xl p-5 md:p-6 overflow-hidden">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div><div class="text-[10px] tracking-[.25em] text-cyan-300 font-black mb-2">SYSTEM V4 // ADAPTIVE TRAINING</div>
                                <h2 class="text-2xl md:text-3xl font-black text-white glow-text">مرکز برنامه‌ریزی هوشمند</h2>
                                <p class="text-sm text-slate-300 mt-2">مأموریت‌ها بر اساس فعالیت هفت روز اخیر تنظیم می‌شوند؛ هدف، پیشرفت پیوسته و قابل‌دوام است.</p>
                            </div>
                            <div class="bg-black/35 border border-cyan-400/30 rounded-2xl p-4 min-w-[150px] text-center">
                                <div class="text-[10px] text-cyan-200">ADAPTIVE MODE</div><div class="text-xl font-black text-white mt-1">{targetLabel}</div>
                                <div class="text-xs text-slate-400 mt-1">{target} دقیقه تمرکز</div>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-2 mt-5">
                            <div class="rounded-xl bg-black/30 p-3 text-center"><div class="text-[10px] text-slate-400">مطالعه ۷ روز اخیر</div><div class="text-xl font-black text-cyan-300">{recentMinutes}<span class="text-xs mr-1">دقیقه</span></div></div>
                            <div class="rounded-xl bg-black/30 p-3 text-center"><div class="text-[10px] text-slate-400">جلسات ثبت‌شده</div><div class="text-xl font-black text-purple-300">{recent.length}</div></div>
                            <div class="rounded-xl bg-black/30 p-3 text-center"><div class="text-[10px] text-slate-400">میانگین هر جلسه</div><div class="text-xl font-black text-amber-300">{average}<span class="text-xs mr-1">دقیقه</span></div></div>
                        </div>
                    </section>

                    <section class="system-panel rounded-2xl p-5">
                        <div class="flex items-center justify-between gap-3 mb-4"><div><div class="text-[10px] text-cyan-400 font-black">DAILY PROTOCOL</div><h3 class="text-lg font-black text-white">مأموریت‌های امروز</h3></div><div class="text-xs text-cyan-200">{doneToday}/{missions.length} تکمیل</div></div>
                        <div class="h-2 bg-slate-950 rounded-full overflow-hidden mb-4"><div class="h-full bg-gradient-to-r from-cyan-500 to-purple-500" style={{width:`${doneToday/missions.length*100}%`}}></div></div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            {missions.map(m => <div key={m.id} class={`rounded-xl border p-4 ${data.completed[`${todayKey}_${m.id}`]?'bg-emerald-950/30 border-emerald-700/50':'bg-slate-950/70 border-slate-800'}`}>
                                <div class="flex items-center justify-between mb-3"><span class="text-[10px] text-cyan-300 font-black">{m.mins} MIN</span><span class="text-[10px] text-amber-300">+{m.xp} XP</span></div>
                                <h4 class="font-bold text-sm text-white">{m.title}</h4><p class="text-xs text-slate-400 leading-6 mt-2 min-h-[48px]">{m.desc}</p>
                                <button disabled={!!data.completed[`${todayKey}_${m.id}`]} onClick={()=>finishMission(m)} class={`w-full mt-3 rounded-lg py-2 text-xs font-black ${data.completed[`${todayKey}_${m.id}`]?'bg-emerald-900/50 text-emerald-300':'bg-cyan-500 text-slate-950 hover:bg-cyan-300'}`}>{data.completed[`${todayKey}_${m.id}`]?'✓ تکمیل شد':'ثبت انجام مأموریت'}</button>
                            </div>)}
                        </div>
                        <p class="text-[10px] text-slate-500 mt-3">ثبت مأموریت به‌صورت دستی است؛ سیستم زمان واقعی مطالعه را فقط از سیاه‌چال‌های کامل‌شده دریافت می‌کند.</p>
                    </section>

                    <section class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                        <div class="system-panel rounded-2xl p-5">
                            <h3 class="font-black text-purple-200 mb-1">برنامه هفتگی</h3><p class="text-[10px] text-slate-500 mb-4">برای هر روز، درس و مدت پیشنهادی اضافه کن.</p>
                            <div class="grid grid-cols-2 gap-2">
                                <select value={weeklyDay} onChange={e=>setWeeklyDay(e.target.value)} class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs">{days.map(d=><option key={d}>{d}</option>)}</select>
                                <select value={weeklySubject} onChange={e=>setWeeklySubject(e.target.value)} class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs">{data.subjects.map(x=><option key={x}>{x}</option>)}</select>
                                <input type="number" min="10" max="180" step="5" value={weeklyMinutes} onChange={e=>setWeeklyMinutes(e.target.value)} class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs" placeholder="دقیقه" />
                                <button onClick={addWeekly} class="rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold">+ افزودن به برنامه</button>
                            </div>
                            <div class="space-y-2 mt-4 max-h-64 overflow-y-auto">{days.map(day=>{const items=data.weekly.filter(x=>x.day===day); return <div key={day} class="rounded-lg bg-slate-950/70 border border-slate-800 p-3"><div class="text-xs font-black text-cyan-200 mb-2">{day}</div>{items.length?items.map(item=><div key={item.id} class="flex items-center justify-between text-xs py-1"><span class="text-slate-200">{item.subject} • {item.minutes} دقیقه</span><button onClick={()=>setData(d=>({...d,weekly:d.weekly.filter(x=>x.id!==item.id)}))} class="text-red-400 px-2">حذف</button></div>):<div class="text-[10px] text-slate-600">هنوز برنامه‌ای ثبت نشده</div>}</div>})}</div>
                        </div>
                        <div class="system-panel rounded-2xl p-5">
                            <h3 class="font-black text-cyan-200 mb-1">تشخیص درس کم‌تمرین</h3><p class="text-[10px] text-slate-500 mb-4">بر اساس زمان ثبت‌شده در هفت روز اخیر؛ کم بودن زمان لزوماً به معنی ضعف علمی نیست.</p>
                            <div class="rounded-xl bg-cyan-950/30 border border-cyan-500/30 p-4 mb-4"><div class="text-[10px] text-cyan-300">پیشنهاد فعلی سیستم</div><div class="text-xl font-black text-white mt-1">{weakest?.subject || '—'}</div><div class="text-xs text-slate-400 mt-1">{weakest?.minutes || 0} دقیقه ثبت‌شده در هفته اخیر</div></div>
                            <div class="space-y-3">{subjectMinutes.map(x=><div key={x.subject}><div class="flex justify-between text-xs mb-1"><span>{x.subject}</span><span class="text-cyan-300">{x.minutes} دقیقه</span></div><div class="h-2 rounded-full bg-slate-950 overflow-hidden"><div class="h-full bg-gradient-to-r from-purple-600 to-cyan-400" style={{width:`${recentMinutes?Math.max(3,x.minutes/Math.max(1,...subjectMinutes.map(z=>z.minutes))*100):0}%`}}></div></div></div>)}</div>
                            <div class="flex gap-2 mt-4"><input value={subjectInput} onChange={e=>setSubjectInput(e.target.value)} placeholder="افزودن نام درس..." class="min-w-0 flex-1 bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs"/><button onClick={addSubject} class="px-3 rounded-lg bg-cyan-700 text-white text-xs font-bold">افزودن</button></div>
                        </div>
                    </section>

                    <section class="system-panel rounded-2xl p-5">
                        <h3 class="font-black text-amber-200 mb-1">پرونده آزمون‌ها و نمرات</h3><p class="text-[10px] text-slate-500 mb-4">نمره‌ها را ثبت کن تا روند پیشرفتت را در طول زمان ببینی.</p>
                        <div class="grid grid-cols-1 sm:grid-cols-4 gap-2">
                            <select value={gradeSubject} onChange={e=>setGradeSubject(e.target.value)} class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs">{data.subjects.map(x=><option key={x}>{x}</option>)}</select>
                            <input type="number" min="0" max="20" step="0.25" value={gradeValue} onChange={e=>setGradeValue(e.target.value)} placeholder="نمره از ۲۰" class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs"/>
                            <input value={gradeNote} onChange={e=>setGradeNote(e.target.value)} placeholder="نام آزمون (اختیاری)" class="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs"/>
                            <button onClick={addGrade} class="rounded-lg bg-amber-500 text-black font-black text-xs">ثبت نمره</button>
                        </div>
                        <div class="mt-4 space-y-2 max-h-64 overflow-y-auto">{data.grades.length?data.grades.map(g=><div key={g.id} class="flex items-center justify-between gap-3 bg-slate-950/70 border border-slate-800 rounded-lg p-3"><div><div class="text-xs font-bold text-white">{g.subject} <span class="text-slate-500 font-normal">{g.note}</span></div><div class="text-[10px] text-slate-500 mt-1">{g.date}</div></div><div class={`text-lg font-black ${g.score>=18?'text-emerald-300':g.score>=14?'text-amber-300':'text-rose-300'}`}>{g.score}/20</div><button onClick={()=>setData(d=>({...d,grades:d.grades.filter(x=>x.id!==g.id)}))} class="text-red-400 text-xs">حذف</button></div>):<div class="text-xs text-slate-600 py-4 text-center">هنوز نمره‌ای ثبت نشده است.</div>}</div>
                    </section>
                </div>
            );
        }

        // ==========================================
        // V5. AWAKENING SKILL TREE + EXAM BOSS ARENA
        // ==========================================
        function AwakeningArena({ player, setPlayer, skillTree, setSkillTree, bossHistory, setBossHistory, addXPAndCrystals, addNotification, addLog, triggerSound }) {
            const [subject, setSubject] = useState('ریاضی');
            const [examTitle, setExamTitle] = useState('آزمون تمرینی');
            const [total, setTotal] = useState(20);
            const [correct, setCorrect] = useState(15);
            const [minutes, setMinutes] = useState(45);
            const [tab, setTab] = useState('skills');
            const skills = [
                {id:'focus',name:'تمرکز شکارچی',branch:'ذهن',icon:'crosshair',desc:'افزایش پاداش XP سیاه‌چال‌ها',effect:'+۲٪ XP به‌ازای هر سطح',cost:60,max:5,color:'cyan'},
                {id:'memory',name:'حافظه آهنین',branch:'ذهن',icon:'brain',desc:'افزایش سنگ مانا از پاکسازی سیاه‌چال',effect:'+۲٪ سنگ مانا به‌ازای هر سطح',cost:60,max:5,color:'purple'},
                {id:'discipline',name:'انضباط پایدار',branch:'نظم',icon:'shield-check',desc:'پاداش اضافه برای تکمیل باس‌فایت‌ها',effect:'+۵٪ XP باس به‌ازای هر سطح',cost:80,max:4,color:'amber'},
                {id:'stamina',name:'استقامت ذهنی',branch:'پایداری',icon:'flame',desc:'مسیر ارتقای پایداری و مدیریت انرژی مطالعه',effect:'مهارت پایداری • حداکثر ۴ سطح',cost:70,max:4,color:'rose'},
                {id:'analysis',name:'تحلیل‌گر نبرد',branch:'دانش',icon:'scan-search',desc:'پاداش بیشتر برای عملکرد دقیق در آزمون‌ها',effect:'+۳٪ XP باس به‌ازای هر سطح',cost:90,max:4,color:'blue'}
            ];
            const levelOf = id => Number(skillTree[id] || 0);
            const buySkill = skill => {
                const current = levelOf(skill.id);
                const price = skill.cost * (current + 1);
                if (current >= skill.max) return;
                if (player.manaCrystals < price) { addNotification('[مانای ناکافی]','برای ارتقای این مهارت سنگ مانای بیشتری لازم است.','warning'); return; }
                setPlayer(p=>({...p,manaCrystals:p.manaCrystals-price}));
                setSkillTree(t=>({...t,[skill.id]:current+1}));
                triggerSound('levelUp'); addLog(`مهارت ${skill.name} به سطح ${current+1} ارتقا یافت.`,'success');
                addNotification('[SKILL UPGRADED]',`${skill.name} به سطح ${current+1} رسید.`,'success');
            };
            const submitBoss = () => {
                const t=Math.max(1,Math.min(200,Number(total)||1));
                const c=Math.max(0,Math.min(t,Number(correct)||0));
                const m=Math.max(1,Math.min(600,Number(minutes)||1));
                const accuracy=Math.round(c/t*100);
                const baseXP=Math.round(25+accuracy*1.25+Math.min(m,120)*0.35);
                const bonus=Math.round(baseXP*(levelOf('discipline')*.05+levelOf('analysis')*.03));
                const xp=baseXP+bonus;
                const crystals=Math.max(5,Math.round(accuracy/10));
                const record={id:Date.now(),subject,title:examTitle.trim()||'نبرد دانشی',total:t,correct:c,minutes:m,accuracy,xp,crystals,date:new Date().toLocaleDateString('fa-IR')};
                setBossHistory(h=>[record,...h].slice(0,100));
                addXPAndCrystals(xp,crystals);
                addLog(`باس‌فایت ${record.title} در درس ${subject}: دقت ${accuracy}٪`,'success');
                triggerSound(accuracy>=80?'levelUp':'reward');
                addNotification('[BOSS DEFEATED]',`دقت ${accuracy}٪ | +${xp} XP | +${crystals} سنگ مانا`,'success');
            };
            const average=bossHistory.length?Math.round(bossHistory.reduce((a,x)=>a+x.accuracy,0)/bossHistory.length):0;
            const skillXPBonus=levelOf('focus')*2;
            const skillCrystalBonus=levelOf('memory')*2;
            return <div class="space-y-5 animate-arise">
                <section class="system-panel monarch-panel rounded-2xl p-5 md:p-6">
                    <div class="text-[10px] tracking-[.25em] text-amber-300 font-black">SYSTEM V5 // AWAKENING PROTOCOL</div>
                    <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 mt-2"><div><h2 class="text-2xl md:text-3xl font-black text-white glow-text">درخت مهارت و میدان باس‌فایت</h2><p class="text-xs text-slate-300 mt-2">توانایی‌ها را با سنگ مانا ارتقا بده و دانش خودت را در نبردهای آزمونی بسنج.</p></div><div class="rounded-xl border border-amber-400/40 bg-amber-950/30 px-4 py-3"><div class="text-[10px] text-amber-200">MANA CRYSTALS</div><div class="text-2xl font-black text-amber-300">💎 {player.manaCrystals}</div></div></div>
                    <div class="grid grid-cols-3 gap-2 mt-5"><div class="rounded-xl bg-black/30 p-3 text-center"><div class="text-[10px] text-slate-400">مهارت‌های ارتقایافته</div><div class="text-xl font-black text-cyan-300">{skills.filter(x=>levelOf(x.id)>0).length}/5</div></div><div class="rounded-xl bg-black/30 p-3 text-center"><div class="text-[10px] text-slate-400">نبردهای ثبت‌شده</div><div class="text-xl font-black text-purple-300">{bossHistory.length}</div></div><div class="rounded-xl bg-black/30 p-3 text-center"><div class="text-[10px] text-slate-400">میانگین دقت</div><div class="text-xl font-black text-amber-300">{average}٪</div></div></div>
                </section>
                <div class="flex gap-2"><button onClick={()=>setTab('skills')} class={`flex-1 rounded-xl py-3 text-sm font-black border ${tab==='skills'?'bg-cyan-950 border-cyan-400 text-cyan-200':'bg-slate-900 border-slate-700 text-slate-400'}`}>✦ Skill Tree</button><button onClick={()=>setTab('boss')} class={`flex-1 rounded-xl py-3 text-sm font-black border ${tab==='boss'?'bg-red-950 border-red-400 text-red-200':'bg-slate-900 border-slate-700 text-slate-400'}`}>⚔ Boss Battle</button></div>
                {tab==='skills' && <section class="system-panel rounded-2xl p-5"><div class="flex items-center justify-between mb-4"><div><div class="text-[10px] text-cyan-300 font-black">PLAYER DEVELOPMENT</div><h3 class="text-lg font-black text-white">شبکه توانایی‌ها</h3></div><span class="text-[10px] text-slate-500">هزینه هر سطح افزایش می‌یابد</span></div><div class="grid grid-cols-1 md:grid-cols-2 gap-3">{skills.map(skill=>{const lv=levelOf(skill.id),price=skill.cost*(lv+1),maxed=lv>=skill.max;return <div key={skill.id} class="relative overflow-hidden rounded-xl border border-slate-700 bg-slate-950/80 p-4"><div class="flex items-start justify-between gap-3"><div class="flex items-center gap-3"><div class="w-11 h-11 rounded-xl border border-cyan-500/40 bg-cyan-950/60 flex items-center justify-center text-cyan-300"><i data-lucide={skill.icon} class="w-5 h-5"></i></div><div><div class="text-[10px] text-purple-300">{skill.branch}</div><h4 class="font-black text-white">{skill.name}</h4></div></div><span class="text-xs font-black text-cyan-300">LV. {lv}/{skill.max}</span></div><p class="text-xs text-slate-400 mt-3">{skill.desc}</p><p class="text-[10px] text-emerald-300 mt-2">{skill.effect}</p><div class="flex gap-1 mt-3">{Array.from({length:skill.max},(_,i)=><div key={i} class={`h-1.5 flex-1 rounded-full ${i<lv?'bg-cyan-400 shadow-neon-blue':'bg-slate-800'}`}></div>)}</div><button disabled={maxed||player.manaCrystals<price} onClick={()=>buySkill(skill)} class={`w-full mt-4 rounded-lg py-2.5 text-xs font-black ${maxed?'bg-emerald-950 text-emerald-300':player.manaCrystals>=price?'bg-cyan-500 text-slate-950 hover:bg-cyan-300':'bg-slate-800 text-slate-500'}`}>{maxed?'✓ حداکثر سطح':`ارتقا • ${price} 💎`}</button></div>})}</div><div class="mt-4 rounded-xl border border-purple-500/30 bg-purple-950/20 p-3 text-xs text-slate-300">اثر مهارت‌های فعال: <b class="text-cyan-300">+{skillXPBonus}٪ XP سیاه‌چال</b> و <b class="text-amber-300">+{skillCrystalBonus}٪ سنگ مانا</b>. مهارت‌های باس‌فایت نیز هنگام ثبت نتیجه، پاداش همان نبرد را افزایش می‌دهند.</div></section>}
                {tab==='boss' && <section class="system-panel rounded-2xl p-5"><div class="text-[10px] text-red-300 font-black">GATE CLASS // EXAMINATION</div><h3 class="text-xl font-black text-white mt-1">ورود به میدان باس‌فایت</h3><p class="text-xs text-slate-400 mt-2 mb-4">پس از یک آزمون یا مجموعه تمرین، نتیجه واقعی خودت را ثبت کن. پاداش بر اساس دقت و زمان تلاش محاسبه می‌شود؛ این بخش آزمون را خودکار تصحیح نمی‌کند.</p><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><label class="text-xs text-slate-300">درس<input value={subject} onChange={e=>setSubject(e.target.value)} class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-3"/></label><label class="text-xs text-slate-300">نام آزمون<input value={examTitle} onChange={e=>setExamTitle(e.target.value)} class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-3"/></label><label class="text-xs text-slate-300">تعداد کل سؤال<input type="number" min="1" max="200" value={total} onChange={e=>setTotal(e.target.value)} class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-3"/></label><label class="text-xs text-slate-300">پاسخ صحیح<input type="number" min="0" max="200" value={correct} onChange={e=>setCorrect(e.target.value)} class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-3"/></label><label class="text-xs text-slate-300 sm:col-span-2">مدت آزمون (دقیقه)<input type="number" min="1" max="600" value={minutes} onChange={e=>setMinutes(e.target.value)} class="block w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-3"/></label></div><button onClick={submitBoss} class="w-full mt-4 rounded-xl bg-gradient-to-r from-red-600 to-purple-600 py-3 text-white font-black shadow-neon-red">ثبت نتیجه و دریافت پاداش</button><div class="mt-5 border-t border-slate-800 pt-4"><div class="flex items-center justify-between"><h4 class="font-black text-white text-sm">گزارش نبردهای قبلی</h4><span class="text-[10px] text-slate-500">{bossHistory.length} RECORDS</span></div>{bossHistory.length?<div class="space-y-2 mt-3 max-h-72 overflow-y-auto">{bossHistory.map(b=><div key={b.id} class="rounded-lg bg-slate-950 border border-slate-800 p-3 flex items-center justify-between gap-3"><div><div class="text-xs font-bold text-white">{b.title} • {b.subject}</div><div class="text-[10px] text-slate-500 mt-1">{b.date} • {b.correct}/{b.total} پاسخ صحیح • {b.minutes} دقیقه</div></div><div class="text-left"><div class="font-black text-cyan-300">{b.accuracy}٪</div><div class="text-[10px] text-amber-300">+{b.xp} XP</div></div></div>)}</div>:<p class="text-xs text-slate-600 text-center py-5">هنوز نبردی ثبت نشده است.</p>}</div></section>}
                <p class="text-[10px] text-slate-600 text-center">پاداش‌ها صرفاً امتیازهای درون بازی هستند؛ نتیجه آزمون و میزان یادگیری را صادقانه ثبت کن.</p>
            </div>;
        }

        // ==========================================
        // 7. COMMAND CENTER / STORY CAMPAIGN
        // ==========================================
        function CommandCenterTab({ player, studySessions, campaign, setCampaign, addXPAndCrystals, addNotification, addLog, triggerSound }) {
            const chapters = [
                { id: 'awakening', code: 'PROLOGUE', title: 'بیداری شکارچی', subtitle: 'آغاز مسیر و ساختن نظم شخصی', rank: 'E', tasks: [
                    { id: 'a1', title: 'اولین سیاه‌چال مطالعه را کامل کن', hint: 'یک جلسه تمرکز کامل' },
                    { id: 'a2', title: 'سه مأموریت روزانه را انجام بده', hint: 'ساختن ریتم روزانه' },
                    { id: 'a3', title: 'یک ویژگی وضعیت را ارتقا بده', hint: 'تخصیص امتیاز وضعیت' }
                ], reward: { xp: 100, crystals: 50 } },
                { id: 'double', code: 'CHAPTER 01', title: 'آزمون تغییر', subtitle: 'عبور از سطح مبتدی و تثبیت عادت مطالعه', rank: 'D', tasks: [
                    { id: 'b1', title: 'پنج جلسه مطالعه ثبت کن', hint: 'پنج سیاه‌چال پاکسازی‌شده' },
                    { id: 'b2', title: 'یک سرباز سایه استخراج کن', hint: 'پس از پاکسازی یک سیاه‌چال' },
                    { id: 'b3', title: 'یک مأموریت اصلی را تکمیل کن', hint: 'از تابلو مأموریت‌ها' }
                ], reward: { xp: 180, crystals: 90 } },
                { id: 'redgate', code: 'CHAPTER 02', title: 'دروازه سرخ', subtitle: 'افزایش استقامت و عبور از چالش‌های سخت', rank: 'C', tasks: [
                    { id: 'c1', title: 'مجموعاً ۳۰۰ دقیقه مطالعه ثبت کن', hint: 'زمان ثبت‌شده در سیاه‌چال‌ها' },
                    { id: 'c2', title: 'یک سایه را به سطح ۵ برسان', hint: 'ارتقای سرباز سایه' },
                    { id: 'c3', title: 'سه مأموریت رتبه B یا بالاتر تکمیل کن', hint: 'چالش‌های جدی‌تر' }
                ], reward: { xp: 300, crystals: 150 } },
                { id: 'monarch', code: 'FINAL CHAPTER', title: 'وارث پادشاه سایه‌ها', subtitle: 'تبدیل پیشرفت روزانه به قدرت پایدار', rank: 'S', tasks: [
                    { id: 'd1', title: 'مجموعاً ۱۲۰۰ دقیقه مطالعه ثبت کن', hint: '۲۰ ساعت تمرکز واقعی' },
                    { id: 'd2', title: 'به سطح ۱۵ بازیکن برس', hint: 'ادامه مسیر ارتقای سطح' },
                    { id: 'd3', title: 'تمام فصل‌های قبلی را تکمیل کن', hint: 'تکمیل کمپین' }
                ], reward: { xp: 600, crystals: 300 } }
            ];
            const totalMinutes = studySessions.reduce((sum, s) => sum + (s.minutes || 0), 0);
            const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const weekly = studySessions.filter(s => new Date(s.date).getTime() >= weekAgo);
            const weeklyMinutes = weekly.reduce((sum, s) => sum + (s.minutes || 0), 0);
            const subjects = Object.entries(weekly.reduce((acc, s) => {
                acc[s.subject] = (acc[s.subject] || 0) + s.minutes;
                return acc;
            }, {})).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const doneCount = chapters.reduce((sum, ch) => sum + ch.tasks.filter(t => campaign[t.id]).length, 0);
            const taskCount = chapters.reduce((sum, ch) => sum + ch.tasks.length, 0);

            const toggleTask = (task, chapter) => {
                if (campaign[task.id]) return;
                const next = { ...campaign, [task.id]: true };
                setCampaign(next);
                triggerSound('complete');
                addLog(`هدف داستانی تکمیل شد: ${task.title}`, 'success');
                const chapterDone = chapter.tasks.every(t => next[t.id]);
                if (chapterDone && !campaign['reward_' + chapter.id]) {
                    setCampaign(prev => ({ ...prev, ...next, ['reward_' + chapter.id]: true }));
                    addXPAndCrystals(chapter.reward.xp, chapter.reward.crystals);
                    addNotification('[فصل پاکسازی شد]', `پاداش فصل ${chapter.code} دریافت شد.`, 'monarch');
                } else {
                    addNotification('[پیشرفت کمپین]', 'یک هدف داستانی ثبت شد. مسیر ادامه دارد.', 'success');
                }
            };

            return (
                <div class="space-y-6">
                    <section class="monarch-panel rounded-3xl p-6 md:p-8 relative overflow-hidden">
                        <div class="absolute -left-12 -top-16 w-64 h-64 rounded-full bg-purple-600/15 blur-3xl pointer-events-none"></div>
                        <div class="relative z-10 flex flex-col lg:flex-row lg:items-center justify-between gap-6">
                            <div>
                                <div class="text-[10px] tracking-[.28em] text-purple-300 font-black mb-2">SHADOW MONARCH // COMMAND CENTER</div>
                                <h2 class="text-2xl md:text-3xl font-black text-white glow-text-monarch">اتاق فرمان پادشاه</h2>
                                <p class="text-sm text-slate-300 mt-2 max-w-2xl">پیشرفت واقعی تو اینجا ثبت می‌شود؛ هر جلسه کامل‌شده، بخشی از پرونده شکارچی و مسیر داستانی تو را می‌سازد.</p>
                            </div>
                            <div class="grid grid-cols-2 gap-3 min-w-[220px]">
                                <div class="bg-black/35 border border-purple-400/30 rounded-2xl p-3 text-center">
                                    <div class="text-[10px] text-purple-200">LEVEL</div>
                                    <div class="text-3xl font-black text-white">{player.level}</div>
                                </div>
                                <div class="bg-black/35 border border-purple-400/30 rounded-2xl p-3 text-center">
                                    <div class="text-[10px] text-purple-200">CAMPAIGN</div>
                                    <div class="text-3xl font-black text-fuchsia-300">{Math.round(doneCount / taskCount * 100)}%</div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-6 h-2 bg-black/50 rounded-full overflow-hidden border border-purple-400/20">
                            <div class="h-full bg-gradient-to-r from-purple-700 via-fuchsia-500 to-cyan-300 rounded-full transition-all" style={{width: `${doneCount / taskCount * 100}%`}}></div>
                        </div>
                        <div class="flex justify-between text-[10px] text-purple-200 mt-2"><span>پیشرفت داستان</span><span>{doneCount} / {taskCount} هدف</span></div>
                    </section>

                    <section class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div class="system-panel rounded-2xl p-4"><div class="text-xs text-slate-400">کل زمان ثبت‌شده</div><div class="text-2xl font-black text-cyan-300 mt-1">{Math.floor(totalMinutes / 60)} <span class="text-xs">ساعت</span> {totalMinutes % 60} <span class="text-xs">دقیقه</span></div></div>
                        <div class="system-panel rounded-2xl p-4"><div class="text-xs text-slate-400">هفت روز اخیر</div><div class="text-2xl font-black text-purple-300 mt-1">{Math.floor(weeklyMinutes / 60)} <span class="text-xs">ساعت</span> {weeklyMinutes % 60} <span class="text-xs">دقیقه</span></div></div>
                        <div class="system-panel rounded-2xl p-4"><div class="text-xs text-slate-400">سیاه‌چال‌های پاکسازی‌شده</div><div class="text-2xl font-black text-amber-300 mt-1">{studySessions.length}</div></div>
                    </section>

                    <section class="system-panel rounded-2xl p-5">
                        <div class="flex items-center justify-between gap-3 mb-4"><h3 class="font-black text-cyan-200">نقشه حرارتی تمرکز هفتگی</h3><span class="text-[10px] text-slate-500">۷ روز اخیر • بر اساس جلسات کامل</span></div>
                        <div class="grid grid-cols-7 gap-2">
                            {Array.from({length: 7}, (_, i) => {
                                const day = new Date(); day.setHours(0,0,0,0); day.setDate(day.getDate() - (6-i));
                                const mins = weekly.filter(s => new Date(s.date).toDateString() === day.toDateString()).reduce((sum,s) => sum+s.minutes,0);
                                return <div key={i} class="text-center">
                                    <div class={`h-14 rounded-xl border flex items-center justify-center text-xs font-black ${mins >= 90 ? 'bg-purple-500/35 border-purple-300 text-purple-100' : mins >= 45 ? 'bg-purple-900/60 border-purple-700 text-purple-200' : mins > 0 ? 'bg-purple-950/70 border-purple-900 text-purple-300' : 'bg-slate-950 border-slate-800 text-slate-600'}`}>{mins ? mins + "'" : '—'}</div>
                                    <div class="text-[10px] text-slate-500 mt-2">{['ش','ی','د','س','چ','پ','ج'][day.getDay() === 6 ? 0 : day.getDay()+1] || '•'}</div>
                                </div>;
                            })}
                        </div>
                    </section>

                    <section class="grid grid-cols-1 lg:grid-cols-5 gap-5">
                        <div class="lg:col-span-3 space-y-3">
                            <div class="flex items-center justify-between"><h3 class="font-black text-purple-200">خط داستانی شکارچی</h3><span class="text-[10px] text-slate-500">STORY MISSIONS</span></div>
                            {chapters.map((ch, index) => {
                                const completed = ch.tasks.filter(t => campaign[t.id]).length;
                                const unlocked = index === 0 || chapters[index-1].tasks.every(t => campaign[t.id]);
                                return <div key={ch.id} class={`rounded-2xl border p-4 ${unlocked ? 'bg-slate-950/75 border-purple-500/35' : 'bg-slate-950/35 border-slate-800 opacity-60'}`}>
                                    <div class="flex justify-between items-start gap-3 mb-3">
                                        <div><div class="text-[9px] tracking-widest text-purple-400 font-black">{ch.code} • RANK {ch.rank}</div><h4 class="font-black text-white mt-1">{ch.title}</h4><p class="text-[11px] text-slate-400 mt-1">{ch.subtitle}</p></div>
                                        <div class="text-xs font-black text-purple-200">{completed}/{ch.tasks.length}</div>
                                    </div>
                                    <div class="space-y-2">
                                        {ch.tasks.map(task => <button key={task.id} disabled={!unlocked || !!campaign[task.id]} onClick={() => toggleTask(task,ch)} class={`w-full text-right rounded-xl border p-3 flex items-center gap-3 ${campaign[task.id] ? 'bg-emerald-950/30 border-emerald-800/60' : unlocked ? 'bg-slate-900/70 border-slate-800 hover:border-purple-500/60' : 'bg-slate-950 border-slate-900'}`}>
                                            <span class={`w-5 h-5 shrink-0 rounded-md border flex items-center justify-center ${campaign[task.id] ? 'bg-emerald-500 border-emerald-400 text-black' : 'border-slate-600'}`}>{campaign[task.id] ? '✓' : ''}</span>
                                            <span class="flex-1"><span class={`block text-xs font-bold ${campaign[task.id] ? 'text-emerald-300 line-through' : 'text-slate-200'}`}>{task.title}</span><span class="block text-[10px] text-slate-500 mt-1">{task.hint}</span></span>
                                            <span class="text-[9px] text-slate-500">{campaign[task.id] ? 'ثبت شد' : unlocked ? 'ثبت هدف' : 'قفل'}</span>
                                        </button>)}
                                    </div>
                                    <div class="mt-3 flex items-center justify-between text-[10px]"><span class="text-slate-500">پاداش فصل: +{ch.reward.xp} XP / 💎 {ch.reward.crystals}</span><span class={campaign['reward_' + ch.id] ? 'text-emerald-400' : 'text-purple-300'}>{campaign['reward_' + ch.id] ? 'پاداش دریافت شد' : unlocked ? 'در دسترس' : 'قفل شده'}</span></div>
                                </div>;
                            })}
                        </div>
                        <div class="lg:col-span-2">
                            <div class="system-panel rounded-2xl p-5 h-full">
                                <div class="flex items-center justify-between mb-4"><h3 class="font-black text-cyan-200">تحلیل دروس</h3><i data-lucide="chart-no-axes-column-increasing" class="w-4 h-4 text-cyan-300"></i></div>
                                {subjects.length ? <div class="space-y-4">{subjects.map(([subject, mins]) => <div key={subject}><div class="flex justify-between text-xs mb-1"><span class="text-slate-200">{subject}</span><span class="text-cyan-300 font-bold">{mins} دقیقه</span></div><div class="h-2 bg-slate-950 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-cyan-700 to-purple-400 rounded-full" style={{width: `${Math.max(4, mins / Math.max(...subjects.map(x=>x[1])) * 100)}%`}}></div></div></div>)}</div> : <div class="text-xs text-slate-500 leading-7 py-5">هنوز جلسه‌ای ثبت نشده است. پس از تکمیل اولین سیاه‌چال، تحلیل زمان مطالعه و تفکیک دروس اینجا نمایش داده می‌شود.</div>}
                                <div class="border-t border-slate-800 mt-5 pt-4 text-[10px] text-slate-500 leading-6">نکته: گزارش‌ها فقط جلسات سیاه‌چالِ کامل‌شده را حساب می‌کنند؛ زمان جلسات نیمه‌تمام در آمار ثبت نمی‌شود.</div>
                            </div>
                        </div>
                    </section>
                </div>
            );
        }

        // ==========================================
        // 8. SYSTEM LOGS TAB
        // ==========================================
        function SystemLogsTab({ logs }) {
            return (
                <div class="system-panel rounded-2xl p-6">
                    <h3 class="text-lg font-black text-cyan-300 mb-4 flex items-center gap-2">
                        <i data-lucide="terminal" class="w-5 h-5"></i>
                        تاریخچه و گزارش‌های سیستم (System Logs)
                    </h3>
                    <div class="bg-slate-950/90 rounded-xl p-4 border border-slate-800 max-h-96 overflow-y-auto space-y-2.5 font-mono text-xs">
                        {logs.map(log => (
                            <div key={log.id} class="flex items-start gap-3 border-b border-slate-900 pb-2">
                                <span class="text-slate-500 shrink-0">[{log.time}]</span>
                                <span class={
                                    log.type === 'arise' ? 'text-purple-400 font-bold' :
                                    log.type === 'levelup' ? 'text-amber-300 font-bold' :
                                    log.type === 'warning' ? 'text-red-400' :
                                    log.type === 'success' ? 'text-emerald-400' :
                                    'text-cyan-300'
                                }>
                                    {log.text}
                                </span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
