<body class="min-h-screen scanline-bg text-slate-100 flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Advanced Web Audio Synthesizer ---
        const playSystemSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;

                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.exponentialRampToValueAtTime(440, now + 0.05);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'levelUp') {
                    const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                    freqs.forEach((f, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(f, now + idx * 0.07);
                        gain.gain.setValueAtTime(0.2, now + idx * 0.07);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.35);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.07);
                        osc.stop(now + idx * 0.07 + 0.35);
                    });
                } else if (type === 'arise') {
                    const bass = ctx.createOscillator();
                    const bassGain = ctx.createGain();
                    bass.type = 'sawtooth';
                    bass.frequency.setValueAtTime(110, now);
                    bass.frequency.exponentialRampToValueAtTime(45, now + 0.9);
                    bassGain.gain.setValueAtTime(0.3, now);
                    bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
                    bass.connect(bassGain);
                    bassGain.connect(ctx.destination);
                    bass.start(now);
                    bass.stop(now + 0.9);

                    const chime = ctx.createOscillator();
                    const chimeGain = ctx.createGain();
                    chime.type = 'sine';
                    chime.frequency.setValueAtTime(440, now + 0.2);
                    chime.frequency.exponentialRampToValueAtTime(880, now + 0.8);
                    chimeGain.gain.setValueAtTime(0.15, now + 0.2);
                    chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
                    chime.connect(chimeGain);
                    chimeGain.connect(ctx.destination);
                    chime.start(now + 0.2);
                    chime.stop(now + 0.85);
                } else if (type === 'complete') {
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((f, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(f, now + idx * 0.09);
                        gain.gain.setValueAtTime(0.16, now + idx * 0.09);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.09);
                        osc.stop(now + idx * 0.09 + 0.25);
                    });
                } else if (type === 'quest') {
                    [587.33, 783.99, 987.77].forEach((f, idx) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + idx * 0.11);
                        gain.gain.setValueAtTime(0.13, now + idx * 0.11);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.11 + 0.22);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + idx * 0.11); osc.stop(now + idx * 0.11 + 0.22);
                    });
                } else if (type === 'reward') {
                    [783.99, 1046.5, 1318.51].forEach((f, idx) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(f, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.12, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.3);
                    });
                } else if (type === 'warning') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.linearRampToValueAtTime(95, now + 0.45);
                    gain.gain.setValueAtTime(0.28, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.45);
                }
            } catch (e) {
                console.log('Audio error', e);
            }
        };

        // Initial Data (Deep copy helper used on reset to guarantee clean state)
        const createDefaultPlayer = () => ({
            name: '',
            job: 'دانش‌آموز تازه‌کار',
            level: 1,
            xp: 0,
            maxXp: 100,
            statPoints: 5,
            manaCrystals: 150,
            blessedBoxes: 1,
            streakDays: 1,
            stats: {
                focus: 10,
                memory: 10,
                stamina: 10,
                intelligence: 10,
                discipline: 10
            },
            completedDungeonsCount: 0,
            totalStudyMinutes: 0
        });

        const createInitialDailyQuests = () => ([
            { id: 'd1', title: 'مطالعه عمیق و بدون حواس‌پرتی (حداقل ۶۰ دقیقه)', xp: 50, crystals: 30, completed: false },
            { id: 'd2', title: 'مرور خلاصه‌ها و نکات کلیدی دیروز', xp: 30, crystals: 15, completed: false },
            { id: 'd3', title: 'حل ۲۰ تست یا تمرین کاربردی', xp: 40, crystals: 20, completed: false },
            { id: 'd4', title: 'برنامه‌ریزی اهداف مطالعه فردا', xp: 20, crystals: 10, completed: false }
        ]);

        const createInitialShopItems = () => ([
            { id: 's1', title: '۱ ساعت گیمینگ یا استراحت آزاد', cost: 100, icon: 'gamepad-2', desc: 'لذت بردن بدون عذاب وجدان' },
            { id: 's2', title: 'تماشای ۱ قسمت انیمه / فیلم', cost: 120, icon: 'tv', desc: 'تجربه یک اپیزود هیجان‌انگیز' },
            { id: 's3', title: 'سفارش خوراکی یا قهوه ویژه', cost: 90, icon: 'coffee', desc: 'تجدید قوا برای نبردهای بعدی' },
            { id: 's4', title: '۳۰ دقیقه شبکه‌های اجتماعی', cost: 50, icon: 'smartphone', desc: 'گشت‌وگذار آزاد در فضای مجازی' }
        ]);

        const createInitialQuests = () => ([
            { id: 'q1', title: 'فتح کامل فصل اول کتاب تخصصی', rank: 'B', xp: 140, crystals: 75, type: 'main', completed: false },
            { id: 'q2', title: 'حفظ ۳۰ لغت یا فرمول کلیدی', rank: 'D', xp: 50, crystals: 25, type: 'side', completed: false },
            { id: 'q3', title: 'شبیه‌سازی آزمون جامع پایان هفته', rank: 'S', xp: 350, crystals: 200, type: 'main', completed: false }
        ]);

        const createInitialShadows = () => ([
            { id: 'sh1', name: 'ایگریس (شوالیه نظم)', subject: 'برنامه‌ریزی پایه', rank: 'Knight', xpBoost: 3, crystalBoost: 2, level: 1 }
        ]);

        const createInitialStudyTasks = () => ([
            { id: 'm1', text: 'یک مبحث مشخص از درس امروز را بخوان', subject: 'ریاضی', done: false },
            { id: 'm2', text: 'چند تمرین تشریحی حل کن', subject: 'فیزیک', done: false },
            { id: 'm3', text: 'اشتباهات یا نکات سخت را مرور کن', subject: 'شیمی', done: false }
        ]);

        const createDefaultPlanData = () => ({
            subjects: ['ریاضی', 'فیزیک', 'شیمی', 'زیست‌شناسی'],
            weekly: [],
            grades: [],
            completed: {}
        });

        function App() {
            const [player, setPlayer] = useState(() => {
                try {
                    const saved = localStorage.getItem('sl_v2_player');
                    return saved ? { ...createDefaultPlayer(), ...JSON.parse(saved) } : createDefaultPlayer();
                } catch { return createDefaultPlayer(); }
            });

            const [dailyQuests, setDailyQuests] = useState(() => {
                try {
                    const saved = localStorage.getItem('sl_v2_daily');
                    return saved ? JSON.parse(saved) : createInitialDailyQuests();
                } catch { return createInitialDailyQuests(); }
            });

            const [quests, setQuests] = useState(() => {
                try {
                    const saved = localStorage.getItem('sl_v2_quests');
                    return saved ? JSON.parse(saved) : createInitialQuests();
                } catch { return createInitialQuests(); }
            });

            const [shopItems, setShopItems] = useState(() => {
                try {
                    const saved = localStorage.getItem('sl_v2_shop');
                    return saved ? JSON.parse(saved) : createInitialShopItems();
                } catch { return createInitialShopItems(); }
            });

            const [shadows, setShadows] = useState(() => {
                try {
                    const saved = localStorage.getItem('sl_v2_shadows');
                    return saved ? JSON.parse(saved) : createInitialShadows();
                } catch { return createInitialShadows(); }
            });

            const [studySessions, setStudySessions] = useState(() => {
                try {
                    const saved = localStorage.getItem('sl_v3_sessions');
                    return saved ? JSON.parse(saved) : [];
                } catch { return []; }
            });

            const [campaign, setCampaign] = useState(() => {
                try {
                    const saved = localStorage.getItem('sl_v3_campaign');
                    return saved ? JSON.parse(saved) : {};
                } catch { return {}; }
            });

            const [skillTree, setSkillTree] = useState(() => {
                try { return JSON.parse(localStorage.getItem('sl_v5_skills') || '{}'); } catch { return {}; }
            });

            const [bossHistory, setBossHistory] = useState(() => {
                try { return JSON.parse(localStorage.getItem('sl_v5_boss_history') || '[]'); } catch { return []; }
            });

            const [studyHub, setStudyHub] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('sl_v6_study_hub') || '{}');
                    return Array.isArray(saved.tasks) ? saved : { tasks: createInitialStudyTasks() };
                } catch { return { tasks: createInitialStudyTasks() }; }
            });

            const [planData, setPlanData] = useState(() => {
                try {
                    return { ...createDefaultPlanData(), ...(JSON.parse(localStorage.getItem('sl_v4_plan') || '{}')) };
                } catch { return createDefaultPlanData(); }
            });

            const [logs, setLogs] = useState(() => {
                try {
                    const saved = localStorage.getItem('sl_v2_logs');
                    return saved ? JSON.parse(saved) : [
                        { id: 1, time: 'امروز', text: 'سیستم بیدار شد. شما به عنوان بازیکن انتخاب شدید.', type: 'system' }
                    ];
                } catch {
                    return [{ id: 1, time: 'امروز', text: 'سیستم بیدار شد. شما به عنوان بازیکن انتخاب شدید.', type: 'system' }];
                }
            });

            const [penaltyActive, setPenaltyActive] = useState(() => localStorage.getItem('sl_v2_penalty') === 'true');
            const [activeTab, setActiveTab] = useState('study');
            const [notifications, setNotifications] = useState([]);
            const [soundEnabled, setSoundEnabled] = useState(true);

            // Modals
            const [levelUpModal, setLevelUpModal] = useState(false);
            const [rewardClaimModal, setRewardClaimModal] = useState(null);
            const [ariseModal, setAriseModal] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);
            const [boxRewardModal, setBoxRewardModal] = useState(null);
            const [editingName, setEditingName] = useState(false);
            const [tempName, setTempName] = useState(player.name);

            // Dungeon Timer State
            const [dungeon, setDungeon] = useState({
                active: false,
                rank: 'E',
                title: 'سیاه‌چال E-Rank (۲۵ دقیقه)',
                subject: '',
                duration: 25 * 60,
                timeLeft: 25 * 60,
                isPaused: false,
                xpReward: 40,
                crystalReward: 25
            });

            // Save all state slices reliably to localStorage
            useEffect(() => { localStorage.setItem('sl_v2_player', JSON.stringify(player)); }, [player]);
            useEffect(() => { localStorage.setItem('sl_v2_daily', JSON.stringify(dailyQuests)); }, [dailyQuests]);
            useEffect(() => { localStorage.setItem('sl_v2_quests', JSON.stringify(quests)); }, [quests]);
            useEffect(() => { localStorage.setItem('sl_v2_shop', JSON.stringify(shopItems)); }, [shopItems]);
            useEffect(() => { localStorage.setItem('sl_v2_shadows', JSON.stringify(shadows)); }, [shadows]);
            useEffect(() => { localStorage.setItem('sl_v2_logs', JSON.stringify(logs)); }, [logs]);
            useEffect(() => { localStorage.setItem('sl_v3_sessions', JSON.stringify(studySessions)); }, [studySessions]);
            useEffect(() => { localStorage.setItem('sl_v3_campaign', JSON.stringify(campaign)); }, [campaign]);
            useEffect(() => { localStorage.setItem('sl_v5_skills', JSON.stringify(skillTree)); }, [skillTree]);
            useEffect(() => { localStorage.setItem('sl_v5_boss_history', JSON.stringify(bossHistory)); }, [bossHistory]);
            useEffect(() => { localStorage.setItem('sl_v6_study_hub', JSON.stringify(studyHub)); }, [studyHub]);
            useEffect(() => { localStorage.setItem('sl_v4_plan', JSON.stringify(planData)); }, [planData]);
            useEffect(() => { localStorage.setItem('sl_v2_penalty', penaltyActive ? 'true' : 'false'); }, [penaltyActive]);

            // Re-render Lucide icons on tab/modal changes
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const triggerSound = (type) => {
                if (soundEnabled) playSystemSound(type);
            };

            const addLog = (text, type = 'info') => {
                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                setLogs(prev => [{ id: Date.now() + Math.random(), time: timeStr, text, type }, ...prev.slice(0, 49)]);
            };

            const addNotification = (title, message, type = 'info') => {
                const id = Date.now() + Math.random();
                setNotifications(prev => [...prev, { id, title, message, type }]);
                triggerSound(type === 'warning' ? 'warning' : type === 'quest' ? 'quest' : type === 'success' ? 'reward' : 'click');
                setTimeout(() => {
                    setNotifications(prev => prev.filter(n => n.id !== id));
                }, 6500);
            };

            // Total Shadow Army Buffs
            const totalShadowXpBoost = shadows.reduce((acc, s) => acc + s.xpBoost, 0);
            const totalShadowCrystalBoost = shadows.reduce((acc, s) => acc + s.crystalBoost, 0);

            const getPlayerTitle = (level) => {
                if (level < 5) return 'شکارچی رتبه E';
                if (level < 10) return 'جوینده دانش (رتبه D)';
                if (level < 18) return 'نکرومنسر کتابخانه (رتبه C)';
                if (level < 30) return 'فرمانده ارتش سایه‌ها (رتبه B)';
                if (level < 45) return 'حکیم اعظم (رتبه A)';
                return 'پادشاه سایه‌ها (Shadow Monarch)';
            };

            const addXPAndCrystals = (xpGained, crystalsGained) => {
                const focusMult = 1 + (player.stats.focus - 10) * 0.02 + (totalShadowXpBoost / 100) + (Number(skillTree.focus || 0) * 0.02);
                const finalXP = Math.round(xpGained * Math.max(1, focusMult));

                const intMult = 1 + (player.stats.intelligence - 10) * 0.03 + (totalShadowCrystalBoost / 100) + (Number(skillTree.memory || 0) * 0.02);
                const finalCrystals = Math.round(crystalsGained * Math.max(1, intMult));

                setPlayer(prev => {
                    let newXp = prev.xp + finalXP;
                    let newLevel = prev.level;
                    let newMaxXp = prev.maxXp;
                    let newStatPoints = prev.statPoints;
                    let newJob = prev.job;
                    let leveledUp = false;

                    while (newXp >= newMaxXp) {
                        newXp -= newMaxXp;
                        newLevel += 1;
                        newMaxXp = Math.round(newMaxXp * 1.25);
                        newStatPoints += 3;
                        leveledUp = true;
                    }

                    if (newLevel >= 30) newJob = 'فرمانروای سایه‌های دانش';
                    else if (newLevel >= 10) newJob = 'نکرومنسر دانش';

                    if (leveledUp) {
                        setLevelUpModal(true);
                        triggerSound('levelUp');
                        addLog(`ارتقای سطح! رسیدن به سطح ${newLevel}`, 'levelup');
                        addNotification('[ارتقای سطح سیستم]', `تبریک! به سطح ${newLevel} رسیدید و ۳ امتیاز وضعیت دریافت کردید!`, 'success');
                    } else {
                        addNotification('[پاداش سیستم]', `+${finalXP} XP و 💎 ${finalCrystals} سنگ مانا دریافت شد.`, 'info');
                    }

                    return {
                        ...prev,
                        level: newLevel,
                        job: newJob,
                        xp: newXp,
                        maxXp: newMaxXp,
                        statPoints: newStatPoints,
                        manaCrystals: prev.manaCrystals + finalCrystals
                    };
                });
            };

            const upgradeStat = (statKey) => {
                if (player.statPoints <= 0) return;
                triggerSound('click');
                setPlayer(prev => ({
                    ...prev,
                    statPoints: prev.statPoints - 1,
                    stats: {
                        ...prev.stats,
                        [statKey]: prev.stats[statKey] + 1
                    }
                }));
                addLog(`ویژگی ${getStatNamePersian(statKey)} ارتقا یافت.`);
            };

            const getStatNamePersian = (key) => {
                const map = {
                    focus: 'تمرکز (Focus)',
                    memory: 'حافظه (Memory)',
                    stamina: 'استقامت (Stamina)',
                    intelligence: 'هوش (Intelligence)',
                    discipline: 'نظم (Discipline)'
                };
                return map[key] || key;
            };

            // Shadow Extraction ("ARISE")
            const handleAriseShadow = (customShadowName) => {
                if (!ariseModal) return;
                triggerSound('arise');
                const rankMap = {
                    'E': { rank: 'Soldier', xp: 2, cry: 1 },
                    'C': { rank: 'Elite', xp: 4, cry: 2 },
                    'A': { rank: 'Knight', xp: 6, cry: 4 },
                    'Red Gate': { rank: 'Marshal', xp: 10, cry: 6 }
                };
                const info = rankMap[ariseModal.rank] || { rank: 'Soldier', xp: 2, cry: 1 };
                
                const newShadow = {
                    id: 'sh_' + Date.now(),
                    name: customShadowName || `سایه ${ariseModal.subject}`,
                    subject: ariseModal.subject,
                    rank: info.rank,
                    xpBoost: info.xp,
                    crystalBoost: info.cry,
                    level: 1
                };

                setShadows(prev => [newShadow, ...prev]);
                addLog(`استخراج سایه موفق: «${newShadow.name}» به ارتش شما پیوست!`, 'arise');
                addNotification('[ARISE! برخیز]', `سایه «${newShadow.name}» با موفقیت استخراج شد و به ارتش شما پیوست!`, 'monarch');
                setAriseModal(null);
            };

            // Open Blessed Random Box
            const openBlessedBox = () => {
                if (player.blessedBoxes <= 0) return;
                triggerSound('levelUp');
                const rewards = [
                    { type: 'crystals', amount: 120, label: '💎 ۱۲۰ سنگ مانای خالص' },
                    { type: 'crystals', amount: 250, label: '💎 ۲۵۰ سنگ مانای سلطنتی' },
                    { type: 'stats', amount: 2, label: '⚡ +۲ امتیاز وضعیت آزاد' },
                    { type: 'xp', amount: 150, label: '✨ +۱۵۰ امتیاز تجربه (XP)' }
                ];
                const picked = rewards[Math.floor(Math.random() * rewards.length)];

                setPlayer(prev => {
                    let updated = { ...prev, blessedBoxes: prev.blessedBoxes - 1 };
                    if (picked.type === 'crystals') updated.manaCrystals += picked.amount;
                    if (picked.type === 'stats') updated.statPoints += picked.amount;
                    return updated;
                });

                if (picked.type === 'xp') {
                    addXPAndCrystals(picked.amount, 0);
                }

                addLog(`جعبه برکت باز شد: ${picked.label}`);
                setBoxRewardModal(picked);
            };

            // Complete System Reset (Resets EVERYTHING including Skill Tree, Mana Crystals, Player Name, Boss History, Plan, Study Hub, Dungeon)
            const requestResetSystem = () => {
                setConfirmModal({
                    title: '[هشدار بازنشانی سیستم]',
                    message: 'آیا مطمئن هستید که می‌خواهید تمام سطوح، سنگ‌های مانا، شبکه توانایی‌ها (Skill Tree)، ارتش سایه‌ها و پیشرفت خود را پاک کنید؟ این عملیات غیرقابل بازگشت است.',
                    danger: true,
                    onConfirm: () => {
                        localStorage.clear();

                        const freshPlayer = createDefaultPlayer();
                        const freshDaily = createInitialDailyQuests();
                        const freshQuests = createInitialQuests();
                        const freshShop = createInitialShopItems();
                        const freshShadows = createInitialShadows();
                        const freshStudyHub = { tasks: createInitialStudyTasks() };
                        const freshPlan = createDefaultPlanData();
                        const freshLogs = [{ id: Date.now(), time: 'اکنون', text: 'سیستم به تنظیمات اولیه بازنشانی شد.', type: 'warning' }];

                        setPlayer(freshPlayer);
                        setTempName('');
                        setEditingName(false);
                        setDailyQuests(freshDaily);
                        setQuests(freshQuests);
                        setShopItems(freshShop);
                        setShadows(freshShadows);
                        setStudySessions([]);
                        setCampaign({});
                        setSkillTree({});
                        setBossHistory([]);
                        setStudyHub(freshStudyHub);
                        setPlanData(freshPlan);
                        setPenaltyActive(false);
                        setDungeon({
                            active: false,
                            rank: 'E',
                            title: 'سیاه‌چال E-Rank (۲۵ دقیقه)',
                            subject: '',
                            duration: 25 * 60,
                            timeLeft: 25 * 60,
                            isPaused: false,
                            xpReward: 40,
                            crystalReward: 25
                        });
                        setLogs(freshLogs);

                        // Explicitly write initial values back so storage is immediately clean and consistent
                        localStorage.setItem('sl_v2_player', JSON.stringify(freshPlayer));
                        localStorage.setItem('sl_v2_daily', JSON.stringify(freshDaily));
                        localStorage.setItem('sl_v2_quests', JSON.stringify(freshQuests));
                        localStorage.setItem('sl_v2_shop', JSON.stringify(freshShop));
                        localStorage.setItem('sl_v2_shadows', JSON.stringify(freshShadows));
                        localStorage.setItem('sl_v3_sessions', JSON.stringify([]));
                        localStorage.setItem('sl_v3_campaign', JSON.stringify({}));
                        localStorage.setItem('sl_v5_skills', JSON.stringify({}));
                        localStorage.setItem('sl_v5_boss_history', JSON.stringify([]));
                        localStorage.setItem('sl_v6_study_hub', JSON.stringify(freshStudyHub));
                        localStorage.setItem('sl_v4_plan', JSON.stringify(freshPlan));
                        localStorage.setItem('sl_v2_logs', JSON.stringify(freshLogs));

                            >
                                صرف‌نظر
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 2. STUDY DUNGEONS TAB
        // ==========================================
        function StudyDungeonTab({ dungeon, setDungeon, setStudySessions, addXPAndCrystals, addNotification, triggerSound, setPlayer, setAriseModal, setConfirmModal, addLog }) {
            const timerRef = useRef(null);

            const dungeonRanks = [
                { rank: 'E', title: 'سیاه‌چال E-Rank (۲۵ دقیقه)', minutes: 25, xp: 45, crystals: 25, color: 'text-cyan-300' },
                { rank: 'C', title: 'سیاه‌چال C-Rank (۵۰ دقیقه)', minutes: 50, xp: 100, crystals: 60, color: 'text-blue-400' },
                { rank: 'A', title: 'سیاه‌چال A-Rank (۹۰ دقیقه)', minutes: 90, xp: 200, crystals: 120, color: 'text-purple-400' },
                { rank: 'Red Gate', title: 'دروازه قرمز Red Gate (۱۲۰ دقیقه)', minutes: 120, xp: 300, crystals: 200, color: 'text-red-400' }
            ];

            const selectRank = (r) => {
                if (dungeon.active) return;
                triggerSound('click');
                setDungeon(prev => ({
                    ...prev,
                    rank: r.rank,
                    title: r.title,
                    duration: r.minutes * 60,
                    timeLeft: r.minutes * 60,
                    xpReward: r.xp,
                    crystalReward: r.crystals
                }));
            };

            const startDungeon = () => {
                if (!dungeon.subject.trim()) {
                    addNotification('[خطای سیستم]', 'ابتدا نام درس یا مبحث مورد نظر را وارد کنید.', 'warning');
                    return;
                }
                triggerSound('complete');
                setDungeon(prev => ({ ...prev, active: true, isPaused: false }));
                addLog(`ورود به سیاه‌چال ${dungeon.rank} برای مطالعه «${dungeon.subject}»`);
                addNotification('[مأموریت آغاز شد]', `سیاه‌چال ${dungeon.title} برای مطالعه «${dungeon.subject}» فعال شد.`, 'quest');
            };

            const abandonDungeon = () => {
                setConfirmModal({
                    title: '[فرار از سیاه‌چال؟]',
                    message: 'در صورت خروج زودهنگام، تمام پیشرفت این جلسه از بین می‌رود و هیچ پاداشی دریافت نخواهید کرد.',
                    danger: true,
                    onConfirm: () => {
                        triggerSound('warning');
                        clearInterval(timerRef.current);
                        setDungeon(prev => ({ ...prev, active: false, timeLeft: prev.duration, isPaused: false }));
                        setConfirmModal(null);
                        addLog(`عقب‌نشینی از سیاه‌چال «${dungeon.subject}»`, 'warning');
                        addNotification('[عقب‌نشینی]', 'شما از سیاه‌چال خارج شدید.', 'warning');
                    }
                });
            };

            useEffect(() => {
                if (dungeon.active && !dungeon.isPaused) {
                    timerRef.current = setInterval(() => {
                        setDungeon(prev => {
                            if (prev.timeLeft <= 1) {
                                clearInterval(timerRef.current);
                                triggerSound('levelUp');
                                const studyMin = Math.round(prev.duration / 60);
                                setStudySessions(history => [{
                                    id: 'session_' + Date.now(),
                                    subject: prev.subject,
                                    rank: prev.rank,
                                    minutes: studyMin,
                                    date: new Date().toISOString()
                                }, ...history].slice(0, 250));
                                addXPAndCrystals(prev.xpReward, prev.crystalReward);
                                
                                setPlayer(p => ({
                                    ...p,
                                    completedDungeonsCount: p.completedDungeonsCount + 1,
                                    totalStudyMinutes: p.totalStudyMinutes + studyMin
                                }));

                                addLog(`پاکسازی کامل سیاه‌چال ${prev.rank}: «${prev.subject}» (${studyMin} دقیقه)`, 'success');
                                setAriseModal({ subject: prev.subject, rank: prev.rank });
                                return { ...prev, active: false, timeLeft: prev.duration, isPaused: false };
                            }
                            return { ...prev, timeLeft: prev.timeLeft - 1 };
                        });
                    }, 1000);
                } else {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [dungeon.active, dungeon.isPaused]);

            const formatTime = (sec) => {
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const progress = ((dungeon.duration - dungeon.timeLeft) / dungeon.duration) * 100;

            return (
                <div class="space-y-6">
                    {!dungeon.active ? (
                        <div class="system-panel rounded-2xl p-6">
                            <div class="system-kicker">SYSTEM // GATE SELECTION</div>
                            <h3 class="text-lg font-black text-cyan-300 mb-1 flex items-center gap-2">
                                <i data-lucide="swords" class="w-5 h-5"></i>
                                انتخاب سیاه‌چال مطالعه (Study Dungeon)
                            </h3>
                            <p class="text-xs text-slate-400 mb-6">پس از پاکسازی هر سیاه‌چال، امکان استخراج سایه آن درس با دستور ARISE فعال می‌شود!</p>

                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                                {dungeonRanks.map(r => (
                                    <div
                                        key={r.rank}
                                        onClick={() => selectRank(r)}
                                        class={`dungeon-rank-card p-4 rounded-xl border cursor-pointer transition-all ${
                                            dungeon.rank === r.rank
                                                ? 'dungeon-rank-selected bg-cyan-950/80 border-cyan-400 shadow-neon-blue scale-[1.02]'
                                                : 'bg-slate-950/60 border-slate-800 hover:border-cyan-800'
                                        }`}
                                    >
                                        <div class="flex justify-between items-center mb-2">
                                            <span class={`font-black text-base ${r.color}`}>Rank {r.rank}</span>
                                            <span class="text-xs bg-slate-900 px-2 py-0.5 rounded text-slate-300 font-bold">{r.minutes} دقیقه</span>
                                        </div>
                                        <p class="text-xs text-slate-300 font-semibold mb-3">{r.title}</p>
                                        <div class="flex justify-between text-xs font-bold border-t border-slate-800 pt-2">
                                            <span class="text-cyan-400">+{r.xp} XP</span>
                                            <span class="text-amber-400">💎 {r.crystals}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div class="flex flex-col sm:flex-row gap-3">
                                <input 
                                    type="text"
                                    placeholder="نام درس یا مبحث هدف (مثلاً: فیزیک الکتریسیته، گرامر زبان، کدنویسی...)"
                                    value={dungeon.subject}
                                    onChange={(e) => setDungeon(prev => ({ ...prev, subject: e.target.value }))}
                                    class="flex-1 bg-slate-950 border border-cyan-900 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400"
                                />
                                <button
                                    onClick={startDungeon}
                                    class="px-8 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-black rounded-xl shadow-neon-blue transition-all flex items-center justify-center gap-2"
                                >
                                    <i data-lucide="play" class="w-5 h-5"></i>
                                    ورود به سیاه‌چال
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div class="system-panel rounded-3xl p-8 border-2 border-cyan-400 shadow-neon-strong text-center">
                            <div class="inline-block px-4 py-1 rounded-full bg-cyan-950 border border-cyan-400 text-cyan-300 text-xs font-black mb-4 animate-pulse">
                                [ در حال نبرد در سیاه‌چال Rank {dungeon.rank} ]
                            </div>
                            <h2 class="text-2xl font-black text-white glow-text mb-1">{dungeon.subject}</h2>
                            <p class="text-xs text-slate-400 mb-8">تمرکز خود را حفظ کنید تا دروازه پاکسازی شود</p>

                            <div class="relative w-64 h-64 mx-auto mb-8 flex items-center justify-center">
                                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                                    <circle cx="50" cy="50" r="44" class="stroke-slate-900" stroke-width="6" fill="transparent" />
                                    <circle
                                        cx="50" cy="50" r="44"
                                        class="stroke-cyan-400 transition-all duration-1000"
                                        stroke-width="6"
                                        stroke-dasharray="276.46"
                                        stroke-dashoffset={276.46 - (276.46 * progress) / 100}
                                        stroke-linecap="round"
                                        fill="transparent"
                                    />
                                </svg>
                                <div class="absolute inset-0 flex flex-col items-center justify-center">
                                    <span class="text-5xl font-black tracking-widest text-cyan-300 font-mono glow-text">
                                        {formatTime(dungeon.timeLeft)}
                                    </span>
                                    <span class="text-xs text-slate-400 mt-2 font-bold">
                                        {dungeon.isPaused ? 'توقف موقت' : 'در حال مطالعه...'}
                                    </span>
                                </div>
                            </div>

                            <div class="flex justify-center gap-4 max-w-md mx-auto">
                                <button
                                    onClick={() => { triggerSound('click'); setDungeon(p => ({ ...p, isPaused: !p.isPaused })); }}
                                    class={`flex-1 py-3 px-6 rounded-xl font-black transition-all flex items-center justify-center gap-2 ${
                                        dungeon.isPaused ? 'bg-emerald-500 text-black' : 'bg-amber-500 text-black'
                                    }`}
                                >
                                    <i data-lucide={dungeon.isPaused ? "play" : "pause"} class="w-5 h-5"></i>
                                    {dungeon.isPaused ? 'ادامه' : 'توقف'}
                                </button>
                                <button
                                    onClick={abandonDungeon}
                                    class="flex-1 py-3 px-6 rounded-xl bg-red-950/80 hover:bg-red-900 border border-red-500/60 text-red-300 font-bold transition-all flex items-center justify-center gap-2"
                                >
                                    <i data-lucide="log-out" class="w-5 h-5"></i>
                                    عقب‌نشینی
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 3. SHADOW ARMY TAB
        // ==========================================
        function ShadowArmyTab({ shadows, setShadows, player, setPlayer, triggerSound, addNotification, addLog }) {
            const upgradeShadow = (id) => {
                const cost = 60;
                if (player.manaCrystals < cost) {
                    triggerSound('warning');
                    addNotification('[کمبود سنگ مانا]', 'برای ارتقای سطح سرباز سایه به ۶۰ سنگ مانا نیاز دارید.', 'warning');
                    return;
                }

                triggerSound('arise');
                setPlayer(p => ({ ...p, manaCrystals: p.manaCrystals - cost }));
                setShadows(prev => prev.map(s => {
                    if (s.id === id) {
                        const updated = {
                            ...s,
                            level: s.level + 1,
                            xpBoost: s.xpBoost + 2,
                            crystalBoost: s.crystalBoost + 1
                        };
                        addLog(`ارتقای سرباز سایه: ${s.name} به سطح ${updated.level} رسید.`);
                        return updated;
                    }
                    return s;
                }));
                addNotification('[ارتقای ارتش سایه]', 'قدرت سرباز سایه افزایش یافت!', 'monarch');
            };

            return (
                <div class="space-y-6">
                    <div class="monarch-panel rounded-2xl p-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 rounded-2xl bg-purple-950 border-2 border-purple-400 flex items-center justify-center shadow-neon-monarch shrink-0">
                                <i data-lucide="ghost" class="w-8 h-8 text-purple-300"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-black text-purple-200 glow-text-monarch">ارتش سایه‌های دانش (Shadow Army)</h3>
                                <p class="text-xs text-slate-300 mt-1">هر سیاه‌چالی که پاکسازی کنید به یک سرباز وفادار تبدیل می‌شود و به صورت دائمی امتیاز XP و سنگ مانای شما را افزایش می‌دهد.</p>
                            </div>
                        </div>
                        <div class="bg-slate-950/90 px-5 py-3 rounded-xl border border-purple-500/40 text-center shrink-0">
                            <span class="text-xs text-slate-400 block">تعداد سربازان سایه</span>
                            <span class="text-2xl font-black text-purple-300">{shadows.length}</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        {shadows.map(sh => (
                            <div key={sh.id} class="monarch-panel rounded-2xl p-5 flex flex-col justify-between hover:border-purple-400 transition-all">
                                <div>
                                    <div class="flex justify-between items-center mb-3">
                                        <span class="text-[11px] font-black px-2.5 py-0.5 rounded bg-purple-950 border border-purple-400 text-purple-200">
                                            {sh.level >= 15 ? 'فرمانده' : sh.level >= 8 ? 'شوالیه' : sh.level >= 4 ? 'نخبه' : sh.rank} • LVL {sh.level}
                                        </span>
                                        <i data-lucide="flame" class="w-4 h-4 text-purple-400"></i>
                                    </div>
                                    <h4 class="text-base font-black text-white mb-1">{sh.name}</h4>
                                    <p class="text-xs text-slate-400 mb-4">منشأ: {sh.subject}</p>
                                </div>

                                <div class="space-y-3 pt-3 border-t border-purple-900/50">
                                    <div class="flex justify-between text-xs font-bold">
                                        <span class="text-cyan-400">بونوس XP: +{sh.xpBoost}%</span>
                                        <span class="text-amber-400">بونوس مانا: +{sh.crystalBoost}%</span>
                                    </div>
                                    <button
                                        onClick={() => upgradeShadow(sh.id)}
                                        class="w-full py-2 rounded-xl bg-purple-600/80 hover:bg-purple-500 text-white text-xs font-black transition-all flex items-center justify-center gap-1.5"
                                    >
                                        <i data-lucide="arrow-up-circle" class="w-4 h-4"></i>
                                        تقویت سایه (💎 ۶۰)
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>

            const [newQuestTitle, setNewQuestTitle] = useState('');

            const toggleQuest = (id) => {
                triggerSound('click');
                setDailyQuests(prev => {
                    const next = prev.map(q => {
                        if (q.id === id) {
                            const updated = !q.completed;
                            if (updated) {
                                addXPAndCrystals(q.xp, q.crystals);
                                addLog(`تکمیل مأموریت روزانه: ${q.title}`);
                            }
                            return { ...q, completed: updated };
                        }
                        return q;
                    });

                    const allDone = next.length > 0 && next.every(item => item.completed);
                    const wasAllDone = prev.length > 0 && prev.every(item => item.completed);
                    if (allDone && !wasAllDone) {
                        setPlayer(p => ({ ...p, blessedBoxes: p.blessedBoxes + 1 }));
                        addNotification('[پاداش ویژه روزانه]', 'تمام مأموریت‌های روزانه تکمیل شد! ۱ عدد «جعبه برکت» دریافت کردید.', 'success');
                        addLog('دریافت جعبه برکت به خاطر تکمیل تمام مأموریت‌های روزانه!', 'success');
                    }
                    return next;
                });
            };

            const addCustomDaily = (e) => {
                e.preventDefault();
                if (!newQuestTitle.trim()) return;
                setDailyQuests(prev => [...prev, {
                    id: 'd_' + Date.now(),
                    title: newQuestTitle.trim(),
                    xp: 35,
                    crystals: 20,
                    completed: false
                }]);
                setNewQuestTitle('');
                addNotification('[مأموریت جدید]', `مأموریت «${newQuestTitle.trim()}» به فهرست روزانه اضافه شد.`, 'quest');

                setDailyQuests(prev => prev.map(q => ({ ...q, completed: false })));

                addNotification('[مأموریت‌های جدید]', 'روز تازه آغاز شد. فهرست مأموریت‌ها آماده دریافت است.', 'quest');
